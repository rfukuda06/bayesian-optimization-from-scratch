[project]
name = "gpbo"
version = "0.1.0"
description = "Gaussian Process regression and Bayesian optimization from scratch"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpbo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
